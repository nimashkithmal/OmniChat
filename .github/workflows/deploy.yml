name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
      SG_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # open SSH only for this runner's IP, for the duration of the job
      - name: Allow runner IP in security group
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd ~/OmniChat
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying $(git log --oneline -1)"
            docker build \
              --build-arg VITE_CLERK_PUBLISHABLE_KEY=$(grep '^CLERK_PUBLISHABLE_KEY=' .env | cut -d= -f2-) \
              -t omnichat .
            docker rm -f omnichat || true
            docker run -d --name omnichat --restart always -p 127.0.0.1:3000:3000 --env-file .env omnichat
            docker image prune -f
            sleep 8
            curl -fsS http://127.0.0.1:3000/health

      - name: Remove runner IP from security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" || true

      - name: Check live site
        run: curl -fsS https://omnichatnimash.duckdns.org/health
